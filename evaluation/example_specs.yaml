# A worked example question, and the template for your own set.
#
# A specification says what a question asks and which molecules it uses. It
# never holds an expected value: the builder runs AeroSysProp and writes the
# key for you, stamped with the software commit and parameter fingerprints.
#
#   python -m evaluation.build_questions --specs evaluation/example_specs.yaml --skip-batch
#
# writes evaluation/example_questions.yaml beside this file. To make your own
# set, copy this file into evaluation/sets/ (ignored by git, so it stays
# yours), change the molecules and the wording, and build it the same way.

defaults:
  temperature_K: 298.15       # used by any question that does not set its own
  tolerance: 0.02             # log10 units: how close a reported value must be to the key
  bp_sources: [bp_nannoolal]  # boiling point fed to the methods that need one

questions:
  - id: example-lookup-01     # any unique name; it labels transcripts and marks
    kind: lookup              # lookup, delta, series, diagnostic, mixture, batch, open or refusal
    tests: >-
      reports vapour pressures from two named methods, with units, and says
      how far apart they are rather than quoting one number
    molecules:
      - {name: MBTCA, smiles: 'OC(=O)CC(C(=O)O)C(C)(C)C(=O)O'}  # 3-methylbutane-1,2,3-tricarboxylic acid
    methods: [vp_simpol, vp_evaporation]  # method IDs, as list_methods gives them
    must_report: [value_with_units, method_named]  # checked automatically by mark.py
    ask: >-
      What is the vapour pressure of MBTCA (3-methylbutane-1,2,3-tricarboxylic
      acid) at 298.15 K according to SIMPOL.1 and EVAPORATION, and how far
      apart are the two estimates?
