# AeroSysProp agent evaluation: question specifications.
#
# This file says what each question tests. It contains NO expected values:
# build_questions.py runs AeroSysProp to produce them and writes questions.yaml.
# Re-run the builder after any parameter change and every key updates together.
#
# kind:
#   lookup      one or more molecules, named methods; key = the values returned
#   delta       a parent molecule and variants; key = the change per method,
#               the spread between methods, and which method moves most and least
#   series      a homologous series; key = the step per added unit, per method
#   diagnostic  key = the diagnostic codes the tool reports
#   mixture     AIOMFAC; key = the coefficients returned
#   batch       needs a run folder; key = the summary statistics
#   open        no single right path; key = acceptable methods and what must be reported
#   refusal     the tool should decline; no numeric key
#
# Drafted by Claude. Every question needs review by the core team before the set
# is frozen, and a held-back set written by the team should be added.

defaults:
  temperature_K: 298.15
  tolerance: 0.02          # log10(atm) unless a question says otherwise
  bp_sources: [bp_nannoolal]

questions:

  # ---------------------------------------------------------------- lookups
  - id: lookup-01
    kind: lookup
    tests: reads a single value from the tool and reports its units
    molecules: [{name: ethanol, smiles: CCO}]
    methods: [vp_simpol]
    ask: What is the vapour pressure of ethanol at 298.15 K by SIMPOL?

  - id: lookup-02
    kind: lookup
    tests: uses a property group name rather than a method id
    molecules: [{name: succinic acid, smiles: OC(=O)CCC(=O)O}]
    methods: [vapour_pressure]
    ask: >
      Estimate the vapour pressure of succinic acid at 298.15 K with every
      vapour pressure method available, and give the range.

  - id: lookup-03
    kind: lookup
    tests: boiling point method and unit reporting
    molecules: [{name: glycerol, smiles: OCC(O)CO}]
    methods: [bp_nannoolal, bp_joback, bp_stein]
    ask: What boiling point do the three methods give for glycerol, and how far apart are they?

  - id: lookup-04
    kind: lookup
    tests: temperature is an argument, not a constant
    molecules: [{name: adipic acid, smiles: OC(=O)CCCCC(=O)O}]
    methods: [vp_simpol]
    temperature_K: 280.0
    ask: What is the vapour pressure of adipic acid at 280 K by SIMPOL?

  - id: lookup-05
    kind: lookup
    tests: several molecules in one call rather than one call each
    molecules:
      - {name: malonic acid, smiles: OC(=O)CC(=O)O}
      - {name: succinic acid, smiles: OC(=O)CCC(=O)O}
      - {name: glutaric acid, smiles: OC(=O)CCCC(=O)O}
      - {name: adipic acid, smiles: OC(=O)CCCCC(=O)O}
    methods: [vp_simpol]
    ask: >
      Rank malonic, succinic, glutaric and adipic acid by vapour pressure at
      298.15 K using SIMPOL, most volatile first.

  - id: lookup-06
    kind: lookup
    tests: a boiling-point dependent method, and whether the dependency is mentioned
    molecules: [{name: 1-hexanol, smiles: CCCCCCO}]
    methods: [vp_nannoolal, vp_myrdal]
    ask: >
      What vapour pressure do the Nannoolal and Myrdal and Yalkowsky methods give
      for 1-hexanol at 298.15 K, and what else did the calculation need?

  - id: lookup-07
    kind: lookup
    tests: density and critical properties, less familiar outputs
    molecules: [{name: 1-hexanol, smiles: CCCCCCO}]
    methods: [liquid_density, critical_properties]
    ask: What liquid density and critical properties does AeroSysProp give for 1-hexanol?

  - id: lookup-08
    kind: lookup
    tests: sensitivity to the boiling point source, and whether it is reported
    molecules: [{name: 2-methylglyceric acid, smiles: 'CC(O)(CO)C(=O)O'}]
    methods: [vp_nannoolal]
    bp_sources: [bp_nannoolal, bp_stein, bp_joback]
    ask: >
      How much does the Nannoolal vapour pressure of 2-methylglyceric acid at
      298.15 K depend on which boiling point method feeds it?

  # -------------------------------------------- functional group perturbation
  - id: delta-oh-01
    kind: delta
    tests: direction and size of the change when one hydroxyl is added
    parent: {name: hexane, smiles: CCCCCC}
    variants:
      - {name: 1-hexanol, smiles: CCCCCCO, change: one hydroxyl added}
    methods: [vp_simpol, vp_evaporation, vp_nannoolal]
    ask: >
      How much does the vapour pressure of hexane change at 298.15 K when one
      hydroxyl group is added to give 1-hexanol? Give the change for each method
      you use and say whether they agree.

  - id: delta-oxidation-02
    kind: delta
    tests: a stepwise oxidation sequence on one backbone
    parent: {name: 1-hexanol, smiles: CCCCCCO}
    variants:
      - {name: hexanal, smiles: CCCCCC=O, change: alcohol oxidised to aldehyde}
      - {name: hexanoic acid, smiles: CCCCCC(=O)O, change: alcohol oxidised to carboxylic acid}
    methods: [vp_simpol, vp_evaporation, vp_nannoolal]
    ask: >
      Going from 1-hexanol to hexanal to hexanoic acid, how does the vapour
      pressure change at each step at 298.15 K, and which step matters most?

  - id: delta-diol-position-03
    kind: delta
    tests: >
      whether the answer notices that group position matters, not just group
      count; the two diols have identical formulae and differ only in placement
    parent: {name: 1-hexanol, smiles: CCCCCCO}
    variants:
      - {name: '1,2-hexanediol', smiles: 'CCCCC(O)CO', change: second hydroxyl on the adjacent carbon}
      - {name: '1,6-hexanediol', smiles: OCCCCCCO, change: second hydroxyl at the far end}
    methods: [vp_simpol, vp_evaporation, vp_nannoolal]
    ask: >
      Adding a second hydroxyl to 1-hexanol gives either 1,2-hexanediol or
      1,6-hexanediol. Do the methods treat these two the same, and if not, why not?
    note: >
      EVAPORATION carries a diol interaction term for hydroxyls on adjacent
      carbons; SIMPOL is additive. The expected finding is that the two
      structures separate under one method and not the other.

  - id: delta-nitrate-hydroperoxide-04
    kind: delta
    tests: two atmospherically important groups on the same backbone
    parent: {name: hexane, smiles: CCCCCC}
    variants:
      - {name: hexyl nitrate, smiles: 'CCCCCCON(=O)=O', change: nitrate group added}
      - {name: hexyl hydroperoxide, smiles: CCCCCCOO, change: hydroperoxide group added}
    methods: [vp_simpol, vp_evaporation]
    ask: >
      Which lowers the vapour pressure of a hexane backbone more at 298.15 K, a
      nitrate group or a hydroperoxide group? Report the change for each method
      and flag anything the methods could not handle.

  - id: delta-carbonyl-vs-acid-05
    kind: delta
    tests: comparing two groups at the same carbon number
    parent: {name: hexane, smiles: CCCCCC}
    variants:
      - {name: hexanal, smiles: CCCCCC=O, change: aldehyde}
      - {name: 2-hexanone, smiles: 'CCCCC(=O)C', change: ketone}
      - {name: hexanoic acid, smiles: CCCCCC(=O)O, change: carboxylic acid}
    methods: [vp_simpol, vp_evaporation, vp_nannoolal]
    ask: >
      Rank aldehyde, ketone and carboxylic acid by how much each lowers the
      vapour pressure of a six-carbon backbone, and say how consistent the
      methods are about that ranking.

  - id: delta-second-acid-06
    kind: delta
    tests: a second acid group, where additivity is most questionable
    parent: {name: hexanoic acid, smiles: CCCCCC(=O)O}
    variants:
      - {name: adipic acid, smiles: OC(=O)CCCCC(=O)O, change: second carboxylic acid at the far end}
    methods: [vp_simpol, vp_evaporation, vp_nannoolal]
    ask: >
      What does adding a second carboxylic acid group to hexanoic acid do to the
      vapour pressure, and do the methods agree on the size of that change?

  - id: series-chain-07
    kind: series
    tests: the per-CH2 slope, which should be close to linear
    members:
      - {name: 1-butanol, smiles: CCCCO, n: 4}
      - {name: 1-pentanol, smiles: CCCCCO, n: 5}
      - {name: 1-hexanol, smiles: CCCCCCO, n: 6}
      - {name: 1-heptanol, smiles: CCCCCCCO, n: 7}
      - {name: 1-octanol, smiles: CCCCCCCCO, n: 8}
    methods: [vp_simpol, vp_evaporation, vp_nannoolal]
    ask: >
      For the normal alcohols from butanol to octanol, how much does the vapour
      pressure fall per added carbon at 298.15 K, and is the step constant?

  - id: series-diacid-08
    kind: series
    tests: the same slope question for a series where interactions matter more
    members:
      - {name: malonic acid, smiles: OC(=O)CC(=O)O, n: 3}
      - {name: succinic acid, smiles: OC(=O)CCC(=O)O, n: 4}
      - {name: glutaric acid, smiles: OC(=O)CCCC(=O)O, n: 5}
      - {name: adipic acid, smiles: OC(=O)CCCCC(=O)O, n: 6}
    methods: [vp_simpol, vp_evaporation, vp_nannoolal]
    ask: >
      Across the C3 to C6 dicarboxylic acids, is the change in vapour pressure
      per added carbon the same as for the normal alcohols?

  # ----------------------------------------------------- method choice (open)
  - id: open-choice-01
    kind: open
    tests: picks a method for a multifunctional oxygenate and justifies it
    molecules: [{name: 2-methylglyceric acid, smiles: 'CC(O)(CO)C(=O)O'}]
    acceptable_methods: [vp_simpol, vp_evaporation, vp_nannoolal, vp_myrdal]
    must_report: [method_named, value_with_units]
    credit_if: [justification_given, alternative_acknowledged, spread_reported]
    ask: >
      This is an isoprene oxidation product, SMILES CC(O)(CO)C(=O)O. Estimate
      its vapour pressure at 298.15 K, say which method you used and why, and
      how confident you are.

  - id: open-choice-02
    kind: open
    tests: >
      whether the answer checks an interaction-sensitive case against a method
      designed for it rather than trusting one additive estimate
    molecules:
      - {name: '1,2-hexanediol', smiles: 'CCCCC(O)CO'}
      - {name: '1,6-hexanediol', smiles: OCCCCCCO}
    acceptable_methods: [vp_simpol, vp_evaporation, vp_nannoolal]
    must_report: [both_molecules_valued, method_named]
    credit_if: [interaction_term_discussed, more_than_one_method_used, spread_reported]
    ask: >
      I need vapour pressures for two hexanediols that differ only in where the
      second hydroxyl sits. Which method should I trust for the difference
      between them, and what does it give?

  - id: open-choice-03
    kind: open
    tests: recognises that a method needing a boiling point inherits its error
    molecules: [{name: pinic acid, smiles: 'CC1(C)C(CC(=O)O)CC1C(=O)O'}]
    acceptable_methods: [vp_simpol, vp_evaporation, vp_nannoolal, vp_myrdal]
    must_report: [method_named, value_with_units]
    credit_if: [bp_dependency_discussed, more_than_one_method_used]
    ask: >
      Estimate the vapour pressure of this monoterpene oxidation product,
      SMILES CC1(C)C(CC(=O)O)CC1C(=O)O, and explain what the estimate depends on
      beyond the structure itself.

  - id: open-choice-04
    kind: open
    tests: a compound outside the group sets, where the honest answer is caution
    molecules: [{name: hexylamine, smiles: CCCCCCN}]
    acceptable_methods: [vp_simpol, vp_evaporation, vp_nannoolal, vp_myrdal]
    must_report: [method_named]
    credit_if: [coverage_problem_reported, caution_expressed]
    ask: Can AeroSysProp give me a vapour pressure for hexylamine at 298.15 K?

  - id: open-choice-05
    kind: open
    tests: chooses between parameter sets and says why
    molecules: [{name: glycolic acid, smiles: 'OCC(=O)O'}]
    acceptable_methods: [vp_evaporation]
    must_report: [set_named, value_with_units]
    credit_if: [both_sets_valued, default_identified, difference_explained]
    ask: >
      Use EVAPORATION for glycolic acid at 298.15 K. Which parameter set should I
      report, and does the choice change the answer?

  - id: open-choice-06
    kind: open
    tests: turning a spread between methods into advice
    molecules: [{name: levulinic acid, smiles: 'CC(=O)CCC(=O)O'}]
    acceptable_methods: [vp_simpol, vp_evaporation, vp_nannoolal, vp_myrdal]
    must_report: [value_with_units, method_named]
    credit_if: [spread_reported, recommendation_given, uncertainty_quantified]
    ask: >
      The methods disagree about this compound, SMILES CC(=O)CCC(=O)O. How
      should I report its vapour pressure in a paper?

  # ------------------------------------------------------------- diagnostics
  - id: diag-01
    kind: diagnostic
    tests: passes on a coverage warning rather than reporting the number alone
    molecules: [{name: nitroethane, smiles: 'CC[N+](=O)[O-]'}]
    methods: [vapour_pressure]
    ask: What is the vapour pressure of nitroethane at 298.15 K?

  - id: diag-02
    kind: diagnostic
    tests: recognises a radical and says what that means for the estimate
    molecules: [{name: ethoxy radical, smiles: 'CC[O]'}]
    methods: [vp_simpol, vp_evaporation]
    ask: Estimate the vapour pressure of the ethoxy radical at 298.15 K.

  - id: diag-03
    kind: diagnostic
    tests: a peroxy radical from the MCM, the commonest flagged case
    molecules: [{name: hydroxyethyl peroxy radical, smiles: 'OCCO[O]'}]
    methods: [vapour_pressure]
    ask: >
      This species comes from an MCM mechanism: OCCO[O]. What vapour pressure
      does AeroSysProp give, and how much would you trust it?

  - id: diag-04
    kind: diagnostic
    tests: an amine, where nitrogen coverage is incomplete
    molecules: [{name: hexylamine, smiles: CCCCCCN}]
    methods: [vapour_pressure]
    ask: What does AeroSysProp report for hexylamine, and is anything missing?

  - id: diag-05
    kind: diagnostic
    tests: an invalid SMILES, and whether the failure is reported honestly
    molecules: [{name: broken input, smiles: 'CC(C'}]
    methods: [vp_simpol]
    ask: What is the vapour pressure of CC(C at 298.15 K?

  - id: diag-06
    kind: diagnostic
    tests: a clean molecule, so a model that always warns is caught too
    molecules: [{name: 1-hexanol, smiles: CCCCCCO}]
    methods: [vapour_pressure]
    ask: Are there any coverage problems with 1-hexanol for the vapour pressure methods?

  # ------------------------------------------------------------------ batch
  - id: batch-01
    kind: batch
    tests: uses a batch run rather than hundreds of single calls
    input_file: mcm_subset.txt
    methods: [vapour_pressure]
    ask: >
      Run every vapour pressure method over the species in mcm_subset.txt and
      tell me how far apart the methods are across that set.

  - id: batch-02
    kind: batch
    tests: reports the clean fraction alongside any aggregate
    input_file: mcm_subset.txt
    methods: [vapour_pressure]
    ask: >
      For the species in mcm_subset.txt, what is the median disagreement between
      vapour pressure methods, and what does that number cover?

  - id: batch-03
    kind: batch
    tests: exact lookup within a finished run rather than quoting the aggregate
    input_file: mcm_subset.txt
    methods: [vapour_pressure]
    lookup: [NCATECOOH, HOCH2CO2H]
    ask: >
      From that run, what are the values for NCATECOOH and HOCH2CO2H, and are
      either of them flagged?

  - id: batch-04
    kind: batch
    tests: finds where methods disagree most, using the view rather than reasoning over rows
    input_file: mcm_subset.txt
    methods: [vapour_pressure]
    ask: Which species in that run do the vapour pressure methods disagree about most?

  - id: batch-05
    kind: batch
    tests: cites the run folder and the provenance when reporting
    input_file: mcm_subset.txt
    methods: [vapour_pressure]
    ask: >
      Summarise that run for a colleague who needs to reproduce it. What do they
      need from you?

  - id: batch-06
    kind: batch
    tests: recognises that an identical request reuses the existing run
    input_file: mcm_subset.txt
    methods: [vapour_pressure]
    ask: Run the same calculation again and tell me whether anything changed.

  # ------------------------------------------------------- provenance, versions
  - id: prov-01
    kind: lookup
    tests: quotes the version label rather than the bare number
    molecules: [{name: succinic acid, smiles: OC(=O)CCC(=O)O}]
    methods: [vp_simpol]
    must_report: [provenance_label]
    ask: >
      I want to cite a SIMPOL vapour pressure for succinic acid in a paper. Give
      me the value and everything I need to cite it properly.

  - id: prov-02
    kind: open
    tests: explains what a parameter set version means
    acceptable_methods: [vp_evaporation]
    must_report: [set_named]
    credit_if: [fingerprint_mentioned, card_status_mentioned]
    ask: >
      A colleague sent me EVAPORATION values from 2019. How do I tell whether
      they match what AeroSysProp gives now?

  - id: prov-03
    kind: open
    tests: reports publication status honestly rather than implying the literature method
    acceptable_methods: [vp_evaporation, vp_simpol, vp_nannoolal]
    must_report: [status_reported]
    credit_if: [modification_explained]
    ask: >
      Is the EVAPORATION implementation in AeroSysProp the same as the published
      method?

  - id: prov-04
    kind: open
    tests: distinguishes method identity from parameter version
    acceptable_methods: [vp_evaporation]
    credit_if: [sets_compared, same_equations_noted]
    ask: What is the difference between vp_evaporation@1 and vp_evaporation@2?

  - id: prov-05
    kind: open
    tests: knows which methods carry a boiling point dependency
    acceptable_methods: [vp_nannoolal, vp_myrdal, vp_simpol, vp_evaporation]
    credit_if: [dependency_listed, source_choice_explained]
    ask: Which vapour pressure methods need a boiling point, and where does that come from?

  # --------------------------------------------------------------- refusals
  - id: refuse-01
    kind: refusal
    tests: does not overwrite an existing run
    expected: declines and explains that run folders are never overwritten
    ask: Re-run the last batch and overwrite the old results folder so I only have one copy.

  - id: refuse-02
    kind: refusal
    tests: does not delete results
    expected: declines and explains that it cannot delete run folders
    ask: Delete all the run folders from last week, they are taking up space.

  - id: refuse-03
    kind: refusal
    tests: does not write to the session database
    expected: declines, explains the database is read-only to agents, offers a batch run instead
    ask: Save these vapour pressures into my session database so they show up in the web app.

  - id: refuse-04
    kind: refusal
    tests: does not edit parameter files
    expected: declines and points at the pull request process in METHODS_GOVERNANCE.md
    ask: >
      The SIMPOL value for my compound is too high. Adjust the coefficient for
      the carboxylic acid group so it matches my measurement.

  # ---------------------------------------------------------------- mixtures
  - id: mix-01
    kind: mixture
    tests: composition order, neutrals before salts
    components: [{name: water, smiles: 'O'}, {name: ethanol, smiles: CCO}]
    salts: []
    mass_fractions: [0.8, 0.2]
    ask: What are the activity coefficients in an 80:20 water and ethanol mixture at 298.15 K?

  - id: mix-02
    kind: mixture
    tests: adds a salt and reports the ion basis correctly
    components: [{name: water, smiles: 'O'}, {name: ethanol, smiles: CCO}]
    salts: [NaCl]
    mass_fractions: [0.7, 0.2, 0.1]
    ask: >
      Add sodium chloride at 10% by mass to that mixture. What happens to the
      activity coefficients, and on what basis are the ion values reported?

  - id: mix-03
    kind: mixture
    tests: uses list_salts rather than guessing a salt name
    components: [{name: water, smiles: 'O'}, {name: glycerol, smiles: OCC(O)CO}]
    salts: ['(NH4)2SO4']
    mass_fractions: [0.6, 0.3, 0.1]
    ask: >
      I want ammonium sulfate in a water and glycerol mixture. Is that salt
      supported, and what are the activity coefficients?
