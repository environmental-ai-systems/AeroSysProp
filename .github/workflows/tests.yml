# Runs on every pull request and every push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install AeroSysProp with test dependencies
        run: pip install -e ".[dev]"

      - name: Check method cards and parameter fingerprints
        # Fails if any parameter file differs from its method card,
        # naming the file. See METHODS_GOVERNANCE.md.
        run: python -m aerosysprop.method_cards

      - name: Run the test suite
        run: >
          pytest -q aerosysprop/tests
          --ignore=aerosysprop/tests/test_main.py
          --ignore=aerosysprop/tests/test_vapour_pressure.py

      - name: Legacy tests (informational)
        # These use relative paths and exact float comparisons that fail in
        # the last digit on some platforms. Kept visible but non-blocking
        # until they are converted to approximate comparisons.
        continue-on-error: true
        working-directory: aerosysprop/tests
        run: pytest -q test_main.py test_vapour_pressure.py
