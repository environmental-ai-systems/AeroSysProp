# Method card: vp_evaporation2
# The versioned record of this prediction technique. See METHODS_GOVERNANCE.md.
# Changes to this file or to the parameter files it lists need core team review.
#
# Fingerprints: to declare a new parameter set, increase parameter_set.version,
# move the old entry to history, set the changed files' fingerprints to null and
# run `python -m aerosysprop.method_cards --record`.
id: vp_evaporation2
name: EVAPORATION (revised alcohol terms)
property: pure-component vapour pressure
output_unit: log10(atm)
status: published-with-modifications
same_model_as: vp_evaporation
model:
  summary: Same equations as vp_evaporation; different parameter set.
  references:
  - citation: Compernolle, Ceulemans and Muller (2011), Atmos. Chem. Phys. 11, 9431-9450
    doi: 10.5194/acp-11-9431-2011
    role: source method
    verified: false
  inputs:
  - SMILES
  - temperature (K)
parameter_set:
  version: 1
  files:
    data/evaporation2.smarts: de48fa142287e647910b39455669e4f3aae108d2b2c80532705b6d0cf8933739
    data/evaporation2.data: f477453f7f4a7a2ce3f0bdd47c4133240e68300c29439dd6e2040c30b897d64a
  origin:
    date: 2018-12
    author: Petroc Shelley
    change: Enol term restricted and a new enol pattern (805) added, and the diol pattern (1902) widened
      to CX3, so enols are treated as alkyl alcohols to match the published EVAPORATION. Coefficients
      identical to vp_evaporation.
history: []
implementation_notes:
- Conceptually parameter set 2 of vp_evaporation. Kept as a separate method ID for backward compatibility;
  merging the IDs is a decision for the core team.
group_interpretation: []
known_limitations:
- Nitro groups and several nitrogen functionalities are not covered (reported as UNMATCHED_ATOMS).
validation:
  reference_outputs: tests/fixtures.json (values frozen from the current implementation)
  group_count_tests: null
  todo: Add group assignment tests from worked examples in the source papers.
review:
  state: draft
  approved_by: []
  approved_on: null
  note: Drafted from the code and README; every field needs checking by the core team.
