id: density_tyn_calus
name: Tyn & Calus (with Rackett-type temperature correction)
property: liquid density
output_unit: g/cm3
status: published-with-modifications
model:
  summary: Molar volume at the boiling point as 0.285 Vc^1.048, extrapolated to temperature with a Rackett-type
    equation.
  references:
  - citation: Tyn and Calus (1975), Processing 21(4), 16-17; as described in Poling, Prausnitz and O'Connell
      (2001)
    doi: null
    role: source method
    verified: false
  inputs:
  - SMILES
  - temperature (K)
  - critical properties from cp_nannoolal
parameter_set:
  version: 1
  files: {}
  origin: As inherited from UManSysProp / current AeroSysProp; first recorded version.
history: []
implementation_notes:
- 'No parameter files: the correlation is in molar_volumes.py and uses the Nannoolal critical volume.'
- Same mixed boiling point issue as density_schroeder (liquid_densities._generic).
group_interpretation: []
known_limitations:
- No SMARTS coverage diagnostic, because it has no groups of its own; check coverage of cp_nannoolal instead.
