history: []
implementation_notes:
- Python port validated against the Fortran AIOMFAC reference for more than 1500 compounds and the common
  atmospheric salts (see methods/activity_coefficients.md).
- Extension subgroups 281 to 285 are specific to AeroSysProp and are dropped by the Fortran reference
  (diagnostic EXTENSION_SUBGROUP).
- SMILES are decomposed into AIOMFAC subgroups by this project's SMARTS; the reference code takes subgroups
  directly.
- Bisulfate dissociation equilibrium is solved by default, matching the Fortran treatment.
group_interpretation: []
known_limitations:
- See the Known limitations section of methods/activity_coefficients.md, including functional groups outside
  the AIOMFAC SMARTS set.
- Missing organic-ion middle-range parameters are reported as MR_PARAM_MISSING.
