# Method card: aiomfac
# The versioned record of this prediction technique. See METHODS_GOVERNANCE.md.
# Changes to this file or to the parameter files it lists need core team review.
#
# Fingerprints: to declare a new parameter set, increase parameter_set.version,
# move the old entry to history, set the changed files' fingerprints to null and
# run `python -m aerosysprop.method_cards --record`.
id: aiomfac
name: AIOMFAC activity coefficients
property: activity coefficients of neutral components and ions in liquid mixtures
output_unit: dimensionless
status: published-with-modifications
model:
  summary: Short-range modified UNIFAC, middle-range organic-ion and ion-ion interactions, and long-range
    Debye-Hueckel terms.
  references:
