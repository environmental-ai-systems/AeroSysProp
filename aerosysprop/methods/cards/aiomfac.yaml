    doi: 10.5194/acp-11-9155-2011
    role: source method
    verified: false
  - citation: Public Fortran AIOMFAC reference code
    doi: null
    role: validation reference
    verified: false
  inputs:
  - SMILES of neutral components
  - salt names
  - mole or mass fractions
  - temperature (K)
