[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosysprop"
version = "0.1.0"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
aerosysprop = [
    "assets/*.gif",
    "assets/*.png",
    "data/*.data",
    "data/*.smarts",
    "data/*.matrix",
    "methods/*.md",
]
