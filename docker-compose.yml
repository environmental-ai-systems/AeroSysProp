# AeroSysProp — container orchestration
# =====================================
# The app and OPERA are SEPARATE containers that talk over this compose network
# (or over your Mac's localhost). The OPERA service is behind a Compose *profile*
# so it is only built/started when you explicitly ask for it — the default
# commands below never touch OPERA (which is a heavy, x86_64-only image).
#
# App only (default):
#     docker compose up --build app              # -> http://localhost:8501
#     docker compose down
#
# App + OPERA (phase 2, once you've supplied the OPERA/MCR installers — see
# opera/README.md):
#     docker compose --profile opera up --build  # app + opera together
#     curl localhost:8601/health                 # check the OPERA service
#
# You do NOT need the app container to use OPERA: run the app natively
# (`streamlit run aerosysprop/app.py`) and start just OPERA with
#     docker compose --profile opera up --build opera
# The native app reaches it at the default http://localhost:8601.

services:
  app:
    build:
      context: .
      dockerfile: aerosysprop/Docker/Dockerfile
    image: aerosysprop-app:latest
    container_name: aerosysprop-app
    ports:
      - "8501:8501"
    environment:
      # Where the app looks for the OPERA service. Inside the compose network the
      # service is reachable by its name (`opera`); when running the app natively
      # the code defaults to http://localhost:8601 instead.
      OPERA_URL: "http://opera:8601"
    restart: unless-stopped

  opera:
    profiles: ["opera"]            # only built/started with `--profile opera`
    build:
      context: ./opera
      dockerfile: Dockerfile
    image: aerosysprop-opera:latest
    container_name: aerosysprop-opera
    platform: linux/amd64          # OPERA is x86_64 only -> emulated on Apple Silicon
    ports:
      - "8601:8601"                # publish so a NATIVE app can reach localhost:8601 too
    restart: unless-stopped
